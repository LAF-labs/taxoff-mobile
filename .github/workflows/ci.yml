name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # 더미 PC + 개발 릴레이(localhost:8787)와 Node 폰으로 페어링·사진·현금매출 전송까지
      - name: smoke (pairing + transfer)
        run: |
          node dev/dummy-pc.ts > dummy-pc.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/dev/status >/dev/null 2>&1 && break; sleep 0.5; done
          timeout 60 node dev/smoke-phone.ts
          kill %1 || true
      - if: failure()
        run: cat dummy-pc.log || true
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            pnpm-lock.yaml
            app.json
            modules/sax-native/android/build.gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo prebuild --platform android --no-install
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --licenses < <(yes) >/dev/null
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Build Android and test the native module
        working-directory: android
        run: ./gradlew :sax-native:testDebugUnitTest :app:assembleDebug --console=plain -PreactNativeArchitectures=x86_64
  vendor:
    # tex 고정 사본(sax-remote·sax-redaction·sax-chat-core)이 사본마다 적힌 VENDORED_FROM 커밋과 같은지.
    # tex는 비공개라 읽기 토큰(TEX_READ_TOKEN)이 있을 때만 돈다.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: pin
        env:
          HAS_TOKEN: ${{ secrets.TEX_READ_TOKEN != '' }}
        run: echo "run=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
      - if: steps.pin.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: LAF-labs/tex
          token: ${{ secrets.TEX_READ_TOKEN }}
          path: .tex
          fetch-depth: 0
          persist-credentials: false
      - if: steps.pin.outputs.run == 'true'
        run: |
          set -e
          for pkg in remote:sax-remote redaction:sax-redaction chat-core:sax-chat-core; do
            name=${pkg%%:*}; dir=${pkg#*:}
            sha=$(sed -n 's/^commit: //p' "vendor/$dir/VENDORED_FROM")
            git -C .tex checkout -q "$sha"
            node scripts/sync-remote.mjs .tex "$name" --check
          done
